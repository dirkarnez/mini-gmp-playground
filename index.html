<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gmp-wasm/dist/mini.umd.min.js"></script>
</head>

<body>
  <a href="https://github.com/dirkarnez/playground" target="_blank">dirkarnez/playground</a><br>
  <div id="container"></div>
  <script>
    const div = document.getElementById("container");
    const log = (...data) => div.innerHTML += `${data.join(String.fromCharCode(0x20))}<br>`;
    const error = (...data) => div.innerHTML += `<span style="color: red">${data.join(String.fromCharCode(0x20))}<span><br>`;
    // log(1,2,3);
    // error(1,2,3);
    
    gmp.init().then(({ calculate }) => {
      // calculate() automatically deallocates all objects created within the callback function
      const result = calculate((g) => {
        return g.Integer(1000).div(g.Integer(3));
      });
      log(result);
    });
  </script>
</body>
</html>
